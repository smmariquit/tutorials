name: Cloudflare Security Insights Scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Full account security audit
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          api() {
            curl -sS -X "$1" "https://api.cloudflare.com/client/v4$2" \
              -H "Authorization: Bearer ${CF_TOKEN}" \
              -H "Content-Type: application/json" \
              "${@:3}"
          }

          echo "=== Token ==="
          api GET "/user/tokens/verify" | jq '{success, status: .result.status}'

          echo "=== Security Center API (needs Security Center Read on token) ==="
          resp=$(api GET "/accounts/${ACCOUNT_ID}/security-center/insights?per_page=5&page=1")
          echo "$resp" | jq '{success, count: .result.count, errors}'
          if echo "$resp" | jq -e '.success' >/dev/null; then
            page=1
            while true; do
              resp=$(api GET "/accounts/${ACCOUNT_ID}/security-center/insights?per_page=100&page=${page}")
              n=$(echo "$resp" | jq -r '.result.issues | length')
              echo "$resp" | jq -r '.result.issues[]? | select(.status=="active" and (.dismissed|not)) | "[\(.severity)] \(.issue_class) — \(.subject)"'
              [ "$n" -lt 100 ] && break
              page=$((page+1))
            done
          fi

          echo "=== Grey-cloud DNS (unproxied A/AAAA/CNAME) ==="
          zones=$(api GET "/zones?per_page=50" | jq -r '.result[] | "\(.id)\t\(.name)"')
          while IFS=$'\t' read -r zid zname; do
            [ -z "$zid" ] && continue
            api GET "/zones/${zid}/dns_records?per_page=100" | jq -r --arg z "$zname" '
              .result[] | select(.proxied == false and (.type=="A" or .type=="AAAA" or .type=="CNAME")) |
              "\($z)\t\(.type)\t\(.name)\t\(.content)"'
          done <<< "$zones"

          echo "=== Per-zone bot settings ==="
          while IFS=$'\t' read -r zid zname; do
            [ -z "$zid" ] && continue
            bfm=$(api GET "/zones/${zid}/settings/bot_fight_mode" | jq -r '.result.value // "n/a"')
            echo "${zname}: bot_fight_mode=${bfm}"
          done <<< "$zones"
